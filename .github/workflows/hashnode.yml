name: Sync Hashnode posts

# Hashnode's GraphQL API became paid-only (Pro) in May 2026, so this reads the
# blog's free public RSS feed instead and saves the posts to posts.json.

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HASHNODE_HOST: christiannsantoso.hashnode.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch posts from the Hashnode RSS feed into posts.json
        run: node .github/scripts/sync-hashnode.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain posts.json activities.json)" ]; then
            git config user.name "hashnode-sync"
            git config user.email "actions@users.noreply.github.com"
            git add posts.json activities.json
            git commit -m "Sync posts from Hashnode"
            git push
          else
            echo "No changes."
          fi
