<html lang="en">

<meta property="og:description" content="Sales Manager in B2B ICT — industrial networking, data centers, AEC, and AI side projects.">
<meta property="og:image" content="https://chxnathanaels.github.io/PersonalWebsite/img/me-face.jpg">
<meta property="og:url" content="https://chxnathanaels.github.io/PersonalWebsite/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='3' y='3' width='42' height='42' rx='11' fill='%23f54e00' stroke='%23151515' stroke-width='2.4'/%3E%3Ctext x='24' y='31' text-anchor='middle' font-family='Arial' font-weight='700' font-size='18' fill='%23fff'%3ECN%3C/text%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
  --hand:"Caveat","Comic Sans MS",cursive;
  --desk:#e5e7e0; --win:#fdfdf8; --win2:#eeefe9; --bar:#f3f4ef;
  --text:#151515; --muted:#65675e; --border:#d0d1c9; --border2:#b6b7af;
  --orange:#f54e00; --yellow:#f7a501; --yellow-d:#c27f00; --blue:#1d4aff; --green:#6aa84f; --purple:#b62ad9; --teal:#29dbbb; --red:#e34c3c;
  --hl:rgba(247,165,1,.22);
  --shadow:0 12px 32px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.06);
}
body.dark{
  --desk:#111215; --win:#1d1f23; --win2:#26282d; --bar:#17181b;
  --text:#eeefe9; --muted:#9a9c94; --border:#34363d; --border2:#4a4c54;
  --hl:rgba(247,165,1,.18);
  --shadow:0 14px 36px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);font-size:14px;color:var(--text);background:var(--desk);-webkit-font-smoothing:antialiased}
body.website{overflow:auto}
body.dark svg [stroke="#151515"]{stroke:#ecece4}
body.dark .paper svg [stroke="#151515"]{stroke:#151515}
button,input,textarea,select{font-family:inherit;font-size:14px;color:inherit}
a{color:var(--blue)} body.dark a{color:#7c95ff}
h1,h2,h3,h4{letter-spacing:-.01em}
.icon-btn{border:0;background:none;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}

/* ---------- chunky buttons ---------- */
.cbtn{position:relative;display:inline-flex;border:1.5px solid var(--yellow-d);border-radius:8px;background:var(--yellow-d);padding:0;cursor:pointer;text-decoration:none;color:#151515!important;font-weight:600;vertical-align:middle}
.cbtn>span{display:inline-flex;align-items:center;gap:7px;padding:6px 15px;border-radius:7px;background:var(--yellow);border:1.5px solid var(--yellow-d);margin:-1.5px;transform:translateY(-3px);transition:transform .12s;white-space:nowrap}
.cbtn:hover>span{transform:translateY(-4.5px)}
.cbtn:active>span{transform:translateY(-1px)}
.cbtn.orange{border-color:#a53400;background:#a53400}.cbtn.orange>span{background:var(--orange);border-color:#a53400;color:#fff}
.cbtn.green{border-color:#3e7a2a;background:#3e7a2a}.cbtn.green>span{background:#7bc35a;border-color:#3e7a2a}
.cbtn.white{border-color:var(--border2);background:var(--border2)}.cbtn.white>span{background:var(--win);border-color:var(--border2);color:var(--text)}
.cbtn.white{color:var(--text)!important}
.cbtn.sm>span{padding:3px 10px;font-size:13px}
.cbtn.lg>span{padding:9px 20px;font-size:15px}
.cbtn svg{width:16px;height:16px}
.field{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;background:var(--win);outline:none;transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:var(--yellow);box-shadow:0 0 0 3px var(--hl)}
textarea.field{resize:vertical;min-height:120px}
.tag{display:inline-block;padding:2px 9px;margin:3px 4px 3px 0;border-radius:5px;font-size:12.5px;font-weight:500;border:1px solid var(--border);background:var(--win2)}
.tag.o{background:#fde7d9;border-color:#f7b48f;color:#8a2c00} .tag.b{background:#e3e9ff;border-color:#a8b8ff;color:#122e9e} .tag.g{background:#e6f3df;border-color:#a9d394;color:#2f5b1f} .tag.p{background:#f4e0fa;border-color:#dba3ee;color:#6b1385}
body.dark .tag.o{background:#3a1d0e;border-color:#6b3014;color:#ffb48a} body.dark .tag.b{background:#151f45;border-color:#2e3f8a;color:#a9b9ff} body.dark .tag.g{background:#18301a;border-color:#2f5b2a;color:#b4e39c} body.dark .tag.p{background:#33173d;border-color:#5f2a73;color:#e7b0f7}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;background:var(--win2)}
.seg button{border:0;background:none;padding:5px 14px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--win);box-shadow:inset 0 -2px 0 var(--orange)}
.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;background:var(--win)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:38px;z-index:5000;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:var(--bar);border-bottom:1px solid var(--border);user-select:none}
#topbar .left,#topbar .right{display:flex;align-items:center;gap:2px;height:100%}
.mlabel{position:relative;height:30px;display:flex;align-items:center;padding:0 10px;border-radius:6px;cursor:default;font-weight:500}
.mlabel:hover,.mlabel.open{background:var(--win2)}
.mlabel.bold{font-weight:700}
.mlabel .logo{width:24px;height:24px}
.dropdown{position:absolute;top:34px;left:0;min-width:230px;padding:5px;background:var(--win);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);font-weight:400;z-index:5001;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.mi{position:relative;padding:6px 10px 6px 28px;border-radius:6px;white-space:nowrap;display:flex;justify-content:space-between;align-items:center;gap:24px;cursor:pointer;color:var(--text);text-decoration:none}
.mi .ck{position:absolute;left:10px;color:var(--orange);font-weight:700}
.mi.dis{color:var(--muted);cursor:default}
.mi:not(.dis):hover{background:var(--hl)}
.mi .sc{color:var(--muted);font-size:12px}
.msep{height:1px;margin:5px 4px;background:var(--border)}
.submenu{display:none;position:absolute;left:calc(100% + 2px);top:-6px;min-width:200px;padding:5px;background:var(--win);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow)}
.mi.has-sub:hover>.submenu{display:block}
.tb-btn{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 9px;border-radius:6px;border:0;background:none;cursor:pointer;color:var(--text);text-decoration:none;font-weight:500}
.tb-btn:hover{background:var(--win2)}
.tb-btn svg{width:17px;height:17px}
.tb-search{border:1px solid var(--border);background:var(--win);min-width:170px;justify-content:space-between;color:var(--muted)}
#clock{font-variant-numeric:tabular-nums;color:var(--muted);padding:0 8px;font-weight:500}

/* ---------- desktop ---------- */
#desktop{position:fixed;inset:38px 0 0 0;overflow:hidden}
#wall{position:absolute;inset:0;transition:background .4s}
.dicon{position:absolute;width:96px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 4px;border-radius:8px;cursor:pointer;user-select:none;touch-action:none;animation:iconIn .5s backwards}
@keyframes iconIn{from{opacity:0;transform:translateY(10px) scale(.9)}}
.dicon svg{width:52px;height:52px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.dicon:hover svg{transform:rotate(-6deg) scale(1.08)}
.dicon span{font-size:12.5px;font-weight:600;text-align:center;line-height:1.2;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--desk) 70%,transparent)}
.dicon.sel span{background:var(--yellow);color:#151515}
.dicon.dragging{opacity:.8;z-index:3;cursor:grabbing}
.sticky{position:absolute;width:210px;padding:14px 16px 16px;background:#fff6a8;color:#3b3200;font-family:var(--hand);font-size:21px;line-height:1.15;box-shadow:0 8px 18px rgba(0,0,0,.18);transform:rotate(-2.5deg);border-radius:2px 2px 10px 2px;cursor:grab;touch-action:none;user-select:none;animation:iconIn .6s .3s backwards}
.sticky::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06);transform:rotate(3deg)}
.sticky b{font-family:var(--font);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:4px;color:#8a7400}
body.dark .sticky{background:#e8d95c}
.polaroid{position:absolute;width:168px;padding:10px 10px 8px;background:#fff;box-shadow:0 10px 22px rgba(0,0,0,.2);transform:rotate(3deg);cursor:pointer;touch-action:none;user-select:none;animation:iconIn .6s .45s backwards;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.polaroid:hover{transform:rotate(0) scale(1.03)}
.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#f7a501;pointer-events:none}
.polaroid div{font-family:var(--hand);font-size:22px;color:#151515;text-align:center;margin-top:4px}
.polaroid::before{content:"";position:absolute;top:-9px;left:50%;width:60px;height:18px;margin-left:-30px;background:rgba(247,165,1,.55);transform:rotate(-4deg)}
.hero-art .me{position:absolute;bottom:0;left:50%;height:96%;transform:translateX(-50%);filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));pointer-events:none}

/* ---------- windows ---------- */
#windows{position:absolute;inset:0;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;pointer-events:auto;background:var(--win);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;min-width:320px;min-height:200px}
.win.opening{animation:winOpen .32s cubic-bezier(.2,1.3,.4,1)}
@keyframes winOpen{from{opacity:0;transform:scale(.88) translateY(12px)}}
.win.closing{transition:transform .16s ease-in,opacity .16s;transform:scale(.94);opacity:0}
.win.minimizing{transition:transform .35s cubic-bezier(.6,0,.8,.4),opacity .35s;transform:translateY(60vh) scale(.2);opacity:0}
.win.anim{transition:left .22s,top .22s,width .22s,height .22s}
.wbar{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;background:var(--win2);border-bottom:1px solid var(--border);cursor:default;user-select:none;touch-action:none}
.win:not(.active) .wbar{background:var(--win)}
.win:not(.active) .wtitle{color:var(--muted)}
.wtitle{flex:1;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wtitle svg{width:20px;height:20px;flex:none}
.wnav{display:flex;gap:2px}
.wnav button,.wctl button{width:28px;height:28px;border-radius:6px;border:0;background:none;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.wnav button:hover:not(:disabled),.wctl button:hover{background:var(--border);color:var(--text)}
.wnav button:disabled{opacity:.35;cursor:default}
.wctl{display:flex;gap:2px}
.wctl .close:hover{background:var(--red);color:#fff}
.wctl svg,.wnav svg{width:14px;height:14px}
.wbody{flex:1;overflow:auto;position:relative}
.grip{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none}
.grip::after{content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-right:2px solid var(--border2);border-bottom:2px solid var(--border2)}
#snap{position:absolute;border:2px dashed var(--orange);background:rgba(245,78,0,.08);border-radius:10px;pointer-events:none;opacity:0;transition:all .15s;z-index:1}
#snap.on{opacity:1}

/* ---------- dock ---------- */
#dock{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:4000;display:flex;align-items:flex-end;gap:4px;padding:6px 8px;background:color-mix(in srgb,var(--win) 88%,transparent);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.nodock #dock{display:none}
.ditem{position:relative;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:9px;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.ditem:hover{transform:translateY(-6px) scale(1.12)}
.ditem svg{width:34px;height:34px}
.ditem.running::after{content:"";position:absolute;bottom:-4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--orange)}
.ditem .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--win);font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.ditem:hover .tip{opacity:1}
.ditem.bounce{animation:bounce .5s ease-in-out 2}
@keyframes bounce{50%{transform:translateY(-14px)}}
.dsep{width:1px;height:30px;background:var(--border);margin:0 4px;align-self:center}

/* ---------- toasts / palette / confetti ---------- */
#toasts{position:fixed;right:16px;bottom:80px;z-index:6000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{width:310px;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--win);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--shadow);pointer-events:auto;animation:toastIn .35s cubic-bezier(.2,1.3,.4,1);transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateX(20px)}
.toast svg{width:34px;height:34px;flex:none}
.toast b{display:block;margin-bottom:2px}.toast p{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
#palette{position:fixed;inset:0;z-index:7000;background:rgba(0,0,0,.25);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
#palette[hidden]{display:none}
.pal{width:min(560px,92vw);background:var(--win);border:1px solid var(--border2);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;animation:pop .15s}
.pal input{width:100%;border:0;border-bottom:1px solid var(--border);padding:14px 16px;font-size:16px;background:transparent;outline:none}
.pal .res{max-height:50vh;overflow:auto;padding:6px}
.pal .r{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;cursor:pointer}
.pal .r svg{width:24px;height:24px;flex:none}
.pal .r small{color:var(--muted);margin-left:auto;font-size:12px}
.pal .r.on{background:var(--hl)}
.pal .foot{padding:7px 12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;gap:14px}
.confetti{position:fixed;width:9px;height:14px;z-index:9000;pointer-events:none;border-radius:2px;animation:conf 1.2s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* ---------- app content ---------- */
.doc{padding:26px 30px;max-width:760px}
.doc h1{font-size:26px;margin:0 0 6px;line-height:1.2}
.doc h2{font-size:19px;margin:22px 0 8px}
.doc p,.doc li{line-height:1.6}
.lead{font-size:16px;color:var(--muted);margin:0 0 16px}
.hero-row{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar{width:84px;height:84px;flex:none;border-radius:16px;overflow:hidden;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;border:2.5px solid #151515;box-shadow:4px 4px 0 #151515;transform:rotate(-3deg)}
body.dark .avatar{border-color:#000;box-shadow:4px 4px 0 #000}
.facts{width:100%;border-collapse:collapse;margin:14px 0 18px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.facts td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.facts tr:last-child td{border-bottom:0}
.facts td:first-child{width:120px;color:var(--muted);font-weight:500;background:var(--win2)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.split{display:flex;height:100%}
.side{width:220px;flex:none;border-right:1px solid var(--border);background:var(--win2);overflow:auto;padding:10px 8px}
.side h6{margin:6px 8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.si{padding:8px 10px;border-radius:7px;cursor:pointer;line-height:1.3;margin-bottom:2px}
.si small{display:block;color:var(--muted);font-size:12px}
.si:hover{background:var(--border)}
.si.on{background:var(--win);box-shadow:inset 3px 0 0 var(--orange),0 1px 2px rgba(0,0,0,.06)}
.main{flex:1;overflow:auto}
.meta{color:var(--muted);margin-bottom:10px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:18px}
.pcard{border:1px solid var(--border2);border-radius:10px;overflow:hidden;background:var(--win);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pcard .ph{height:84px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border2)}
.pcard .ph svg{width:46px;height:46px}
.pcard .pb{padding:12px 14px}
.pcard h3{font-size:15px;margin:0 0 4px;line-height:1.3}
.pcard p{margin:6px 0;font-size:13px;color:var(--muted);line-height:1.5}
.award{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--yellow);color:#151515;margin-left:4px;vertical-align:middle}
.box{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px;background:var(--win)}
.box h3{margin:0 0 8px;font-size:15px}
.li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border)}
.li:last-child{border-bottom:0}
.li .dot{width:30px;height:30px;flex:none;border-radius:8px;border:2px solid #151515;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#151515}
.paperwrap{background:var(--win2);min-height:100%;padding:20px}
.paper{max-width:760px;margin:0 auto;background:#fff;color:#151515;padding:44px 50px;border:1px solid var(--border2);box-shadow:var(--shadow);transform-origin:top center;line-height:1.5;font-size:13.5px}
.paper h1{font-size:24px;margin:0;text-align:center}
.paper .c{text-align:center;color:#555;font-size:12px;margin-bottom:12px}
.paper h4{border-bottom:2px solid #151515;margin:18px 0 6px;letter-spacing:.08em;font-size:12px}
.paper .r{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.paper .it{font-style:italic;font-weight:400;color:#444}
.paper ul{margin:4px 0 8px;padding-left:18px}
.toolbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--win)}
.plist .pi{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.plist .pi:hover{background:var(--win2)}
.plist .pi b{display:block;line-height:1.35}
.plist .pi small{color:var(--muted)}
.post .body{line-height:1.7;font-size:15px}
.post .body img{max-width:100%;height:auto;border-radius:8px}.post pre{background:#151515;color:#eee;padding:12px;border-radius:8px;overflow:auto}.post pre code{background:none;border:0;color:inherit}
.post code{font-family:var(--mono);font-size:13px;background:var(--win2);border:1px solid var(--border);padding:1px 5px;border-radius:4px}
.sample{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px dashed var(--orange);color:var(--orange);margin-left:6px;vertical-align:middle}
.cms{margin:10px;padding:10px 12px;border:1px dashed var(--border2);border-radius:8px;font-size:12.5px;color:var(--muted);line-height:1.5}
.cform{padding:20px 24px;display:grid;gap:12px}

.to-line{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--win2);font-size:13px}
.to-line svg{width:20px;height:20px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.shake{animation:shake .4s}

.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:10px 0 6px}
.wt{cursor:pointer;font-size:12.5px;font-weight:500;text-align:center}
.wt div{height:74px;border-radius:8px;border:2px solid var(--border);margin-bottom:5px;transition:transform .15s}
.wt:hover div{transform:translateY(-2px)}
.wt.on div{border-color:var(--orange);box-shadow:0 0 0 3px rgba(245,78,0,.2)}
.prow{display:flex;align-items:center;gap:14px;margin:14px 0;flex-wrap:wrap}
.prow>label:first-child{width:130px;font-weight:600}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--border2);cursor:pointer;transition:background .2s}
.switch span::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,1.5,.5,1);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--orange)}
.switch input:checked+span::after{transform:translateX(18px)}
.term{background:#151515;color:#d8d8d0;font:13px/1.5 var(--mono);padding:10px 12px;height:100%;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .g{color:#7bc35a}.term .y{color:var(--yellow)}.term .o{color:#ff8a4c}
.term input{background:transparent;border:0;outline:none;color:#fff;font:inherit;width:70%}

/* ---------- activities ---------- */
.act-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--win);position:sticky;top:0;z-index:2}
.chip{border:1.5px solid var(--border);background:var(--win2);border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text)}
.chip.on{background:var(--text);color:var(--win);border-color:var(--text)}
.timeline{position:relative;padding:8px 18px 24px 18px}
.tl-year{font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.06em;margin:16px 0 8px 66px}
.act{position:relative;display:flex;gap:14px;align-items:stretch;margin:0 0 12px;cursor:pointer}
.act::before{content:"";position:absolute;left:27px;top:56px;bottom:-14px;width:2px;background:var(--border)}
.act:last-child::before{display:none}
.act-date{width:56px;flex:none;height:56px;border:2px solid #151515;border-radius:10px;background:var(--win);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:3px 3px 0 #151515;line-height:1.05;position:relative;z-index:1}
body.dark .act-date{border-color:#000;box-shadow:3px 3px 0 #000}
.act-date b{font-size:20px}.act-date span{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--orange)}
.act-card{flex:1;display:flex;gap:12px;border:1px solid var(--border2);border-radius:10px;background:var(--win);padding:12px 14px;transition:transform .15s,box-shadow .15s;min-width:0}
.act:hover .act-card{transform:translateY(-2px);box-shadow:var(--shadow)}
.act-card h3{margin:2px 0 4px;font-size:15px;line-height:1.3}
.act-card .m{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.act-card p{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.act-thumb{width:110px;height:76px;flex:none;border-radius:8px;object-fit:cover;border:1px solid var(--border)}
.type{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1.5px solid #151515;color:#151515;text-transform:uppercase;letter-spacing:.04em}
.from-cv{font-size:11px;color:var(--muted);border:1px dashed var(--border2);border-radius:999px;padding:0 7px}
.act-empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:760px){.act-thumb{display:none}.tl-year{margin-left:0}}

.sec{background:var(--win);border:1px solid var(--border2);border-radius:12px;margin-bottom:24px;overflow:hidden;box-shadow:0 2px 0 var(--border)}

.job:last-child{border:0;margin:0;padding:0}
.job h3{margin:0 0 2px}.job ul{padding-left:18px;line-height:1.6}

.sheet{width:min(720px,100%);background:var(--win);border:1px solid var(--border2);border-radius:12px;box-shadow:var(--shadow);animation:pop .2s}
.sfoot{text-align:center;color:var(--muted);font-size:13px;padding:24px}

body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  const r=rng(42),n=[];for(let i=0;i<34;i++)n.push([r()*1600,r()*1000]);
  let l='';n.forEach((a,i)=>n.forEach((b,j)=>{if(j>i&&Math.hypot(a[0]-b[0],a[1]-b[1])<260)l+=`<line x1="${a[0]|0}" y1="${a[1]|0}" x2="${b[0]|0}" y2="${b[1]|0}"/>`}));
  const c=dark?'#ffffff':'#151515';
  return svgURL(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"><g stroke="${c}" stroke-opacity=".09" stroke-width="1.5">${l}</g>${n.map((p,i)=>`<circle cx="${p[0]|0}" cy="${p[1]|0}" r="${i%5?4:7}" fill="${i%7===0?'#f54e00':i%5===0?'#f7a501':c}" fill-opacity="${i%5&&i%7?.18:.7}"/>`).join('')}</svg>`);
}
function planSVG(){
  return svgURL(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"><rect x="900" y="180" width="560" height="620"/><path d="M900 420h300v380M1200 180v160M1200 520h260M1050 420v-240"/><path d="M1200 340a80 80 0 0 1 80 80" stroke-dasharray="6 6"/><path d="M1050 420a70 70 0 0 0 70 -70" stroke-dasharray="6 6"/></g><g fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"><path d="M900 140h560M900 130v20M1460 130v20"/><circle cx="1330" cy="660" r="60"/><rect x="960" y="480" width="180" height="90"/></g><text x="900" y="860" fill="#fff" fill-opacity=".35" font-family="monospace" font-size="20">PLAN — LEVEL 01 · SCALE 1:100</text></svg>`);
}

async function fromHashnode(){
  const q=`query($host:String!){publication(host:$host){url posts(first:20){edges{node{title slug url brief publishedAt readTimeInMinutes coverImage{url} tags{name} content{html}}}}}}`;
  const r=await fetch('https://gql.hashnode.com',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,variables:{host:HASHNODE_HOST}})});
  if(!r.ok)return null;const j=await r.json();const pub=j&&j.data&&j.data.publication;if(!pub)return null;
  const list=pub.posts.edges.map(e=>e.node).map(n=>({title:n.title,slug:n.slug,url:n.url,date:(n.publishedAt||'').slice(0,10),excerpt:n.brief,tags:(n.tags||[]).map(t=>t.name),cover:n.coverImage&&n.coverImage.url,read:n.readTimeInMinutes,html:n.content&&n.content.html}));
  window.__blogURL=pub.url;return list.length?list:null}
async function fromJSON(){const r=await fetch('posts.json',{cache:'no-store'});if(!r.ok)return null;const j=await r.json();return Array.isArray(j)&&j.length?j:null}
async function loadPosts(){
  const show=(list,src)=>{POSTS=list;postSource=src;refreshApp('journal');if(S.mode==='website')renderSite();renderMenus()};
  // 1) posts.json — synced from Hashnode every hour by the GitHub Action (reliable, never blocked)
  try{const l=await fromJSON();if(l)show(l,'hashnode')}catch(e){}
  try{const r=await fetch('activities.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length){ACTS=[...j,...ACT_SEED];refreshApp('activities');if(S.mode==='website')renderSite();renderMenus()}}}catch(e){}
  // (Hashnode's API blocks browser requests (CORS), so the site never calls it directly.)
}
const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function md(src){return src.split(/\n\s*\n/).map(b=>{const L=b.split('\n');
  if(/^##\s/.test(b)){const[h,...r]=L;return `<h2>${inline(h.replace(/^##\s*/,''))}</h2>`+(r.length?md(r.join('\n')):'')}
  if(L.every(l=>/^- /.test(l)))return '<ul>'+L.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')+'</ul>';
  return `<p>${L.map(inline).join('<br>')}</p>`}).join('')}
const fmtDate=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}};

function itemHTML(it,path){
  if(it.sep)return'<div class="msep"></div>';
  const ck=it.check?'<span class="ck">✓</span>':'';
  if(it.sub)return `<div class="mi has-sub">${ck}<span>${it.label}</span><span class="sc">›</span><div class="submenu">${it.sub.map((s,j)=>itemHTML(s,path+'.'+j)).join('')}</div></div>`;
  if(it.href)return `<a class="mi" href="${it.href}" target="_blank" rel="noopener" data-close="1"><span>${it.label}</span><span class="sc">↗</span></a>`;
  return `<div class="mi ${it.dis?'dis':''}" data-mpath="${path}">${ck}<span>${it.label}</span>${it.sc?`<span class="sc">${it.sc}</span>`:''}</div>`;
}
function renderMenus(){const M=menus();$('#mleft').innerHTML=M.map((m,i)=>`<div class="mlabel ${m.bold?'bold':''} ${m.cls||''} ${openMenu===i?'open':''}" data-menu="${i}">${m.label}${openMenu===i?`<div class="dropdown">${m.items.map((it,j)=>itemHTML(it,i+'.'+j)).join('')}</div>`:''}</div>`).join('')}
function findItem(path){const p=path.split('.').map(Number);let list=menus()[p[0]].items,cur;for(let k=1;k<p.length;k++){cur=list[p[k]];list=cur.sub}return cur}
$('#mleft').addEventListener('click',e=>{
  const mi=e.target.closest('[data-mpath]');
  if(mi){e.stopPropagation();if(mi.classList.contains('dis'))return;const it=findItem(mi.dataset.mpath);openMenu=-1;renderMenus();it&&it.act&&it.act();return}
  if(e.target.closest('[data-close]')){openMenu=-1;renderMenus();return}
  if(e.target.closest('.has-sub')||e.target.closest('.dropdown'))return;
  const l=e.target.closest('[data-menu]');if(!l)return;e.stopPropagation();const i=+l.dataset.menu;openMenu=openMenu===i?-1:i;renderMenus()});
$('#mleft').addEventListener('mouseover',e=>{const l=e.target.closest('[data-menu]');if(openMenu>=0&&l&&+l.dataset.menu!==openMenu&&!e.target.closest('.dropdown')){openMenu=+l.dataset.menu;renderMenus()}});
document.addEventListener('click',e=>{if(openMenu>=0&&!e.target.closest('#mleft')){openMenu=-1;renderMenus()}});
function renderRight(){
  $('#mright').innerHTML=`<button class="tb-btn tb-search" id="tb-search"><span style="display:flex;gap:6px;align-items:center">${ICONS.search}<span class="hide-s">Search</span></span><span class="kbd hide-s">⌘K</span></button>
   <button class="tb-btn" id="tb-theme" title="Toggle light/dark">${isDark()?ICONS.moon:ICONS.sun}</button>

function defaultPos(id){const H=innerHeight-38;let i=DESK_L.findIndex(d=>d[0]===id);const step=Math.min(98,(H-80)/DESK_L.length);
  if(i>=0)return{x:14,y:12+i*step};i=DESK_R.findIndex(d=>d[0]===id);const rs=Math.min(98,(H-80)/DESK_R.length);return{x:innerWidth-110,y:12+i*rs}}
function renderIcons(){
  const small=innerWidth<760;
  const all=[...DESK_L,...DESK_R];
  $('#icons').innerHTML=all.map(([id,label],k)=>{let p=S.iconPos[id]||defaultPos(id);
    if(small){p={x:8+(k%4)*((innerWidth-16)/4),y:10+Math.floor(k/4)*96}}
    p={x:Math.min(Math.max(0,p.x),innerWidth-96),y:Math.min(Math.max(0,p.y),innerHeight-150)};
    return `<div class="dicon" data-icon="${id}" style="left:${p.x}px;top:${p.y}px;animation-delay:${k*40}ms" tabindex="0" role="button" aria-label="${label}">${ICONS[id==='trash'?'trash':APPS[id].icon]}<span>${label}</span></div>`}).join('')
   +(small?'':`<div class="sticky" data-icon="sticky" style="left:${(S.iconPos.sticky||{x:150}).x}px;top:${(S.iconPos.sticky||{y:innerHeight-330}).y}px"><b>Now</b>Helping system integrators connect industrial sites — routers, switches &amp; gateways. Building AI things on the side ✨</div>
     <div class="polaroid" data-icon="polaroid" style="left:${(S.iconPos.polaroid||{x:innerWidth-330}).x}px;top:${(S.iconPos.polaroid||{y:innerHeight-420}).y}px"><img src="img/me-face.jpg" alt="Photo of Christian"><div>that's me 👋</div></div>`);
}
function dragEl(el,e,onClick){
  const sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;let moved=false;el.setPointerCapture(e.pointerId);
  const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.hypot(dx,dy)<5)return;moved=true;el.classList.add('dragging');
    el.style.left=Math.min(innerWidth-60,Math.max(0,ox+dx))+'px';el.style.top=Math.min(innerHeight-120,Math.max(0,oy+dy))+'px'};
  const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.classList.remove('dragging');
    if(moved){S.iconPos[el.dataset.icon]={x:el.offsetLeft,y:el.offsetTop};store.set('iconPos',S.iconPos)}else onClick&&onClick()};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)}
$('#icons').addEventListener('pointerdown',e=>{const d=e.target.closest('[data-icon]');if(!d||e.button)return;e.preventDefault();
  document.querySelectorAll('.dicon').forEach(x=>x.classList.toggle('sel',x===d));
  dragEl(d,e,()=>{const id=d.dataset.icon;if(id==='sticky')return;if(id==='polaroid'){openApp('about');return}id==='trash'?trash():openApp(id)})});
$('#icons').addEventListener('keydown',e=>{if(e.key==='Enter'){const d=e.target.closest('[data-icon]');if(d)d.dataset.icon==='trash'?trash():openApp(d.dataset.icon)}});
$('#wall').addEventListener('pointerdown',()=>{document.querySelectorAll('.dicon').forEach(x=>x.classList.remove('sel'));setActive(null)});
function resetIcons(){S.iconPos={};store.set('iconPos',{});renderIcons();toast('Tidied up','Desktop icons are back in their places.','prefs')}

/* ================= WINDOWS ================= */
const openWins={};let z=100,casc=0;
function setActive(id){activeId=id;document.querySelectorAll('.win').forEach(w=>w.classList.toggle('active',w.dataset.id===id));renderMenus()}
function focusWin(id){const w=openWins[id];if(!w)return;w.el.style.zIndex=++z;setActive(id)}
function deskH(){return innerHeight-38}
function openApp(id){
  if(!APPS[id])return;
  if(S.mode==='website'){const t=document.getElementById(id);if(t){t.scrollIntoView({behavior:'smooth'});history.replaceState(null,'','#'+id)}return}
  const ex=openWins[id];if(ex){if(ex.min)restore(id);focusWin(id);return}
  const A=APPS[id],vw=innerWidth,vh=deskH(),small=vw<760;
  const w=small?vw-12:Math.min(A.w,vw-260),h=small?vh-80:Math.min(A.h,vh-90);
  const x=small?6:Math.max(120,Math.min(vw-w-120,(vw-w)/2+((casc%5)-2)*36)),y=small?6:Math.max(8,Math.min(vh-h-70,30+(casc%5)*26));casc++;
  const el=document.createElement('div');el.className='win'+(S.anim?' opening':'');el.dataset.id=id;
  Object.assign(el.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',zIndex:++z});
  el.innerHTML=`<div class="wbar">${A.nav?`<div class="wnav"><button data-nav="back" disabled title="Back">${ICONS.back}</button><button data-nav="fwd" disabled title="Forward">${ICONS.fwd}</button></div>`:''}<div class="wtitle">${ICONS[A.icon]}<span>${A.title}</span></div><div class="wctl"><button class="min" title="Minimize">${ICONS.min}</button><button class="max" title="Maximize">${ICONS.max}</button><button class="close" title="Close">${ICONS.close}</button></div></div><div class="wbody">${A.render()}</div><div class="grip"></div>`;
  $('#windows').appendChild(el);el.addEventListener('animationend',()=>el.classList.remove('opening'),{once:true});
  openWins[id]={el,min:false,hist:[],hi:-1};wireWin(id,el);setupApp(id,el);focusWin(id);renderDock();
  if(S.anim){const di=document.querySelector(`[data-dock="${id}"]`);if(di){di.classList.remove('bounce');void di.offsetWidth;di.classList.add('bounce');setTimeout(()=>di.classList.remove('bounce'),1100)}}
  if(location.hash.slice(1)!==id)history.replaceState(null,'','#'+id);
}
function refreshApp(id){const w=openWins[id];if(!w)return;w.el.querySelector('.wbody').innerHTML=APPS[id].render();setupApp(id,w.el)}
function closeWin(id){const w=openWins[id];if(!w)return;delete openWins[id];w.el.classList.add('closing');setTimeout(()=>w.el.remove(),S.anim?170:0);
  const rest=Object.keys(openWins).filter(k=>!openWins[k].min).sort((a,b)=>openWins[b].el.style.zIndex-openWins[a].el.style.zIndex);setActive(rest[0]||null);renderDock();
  if(location.hash.slice(1)===id)history.replaceState(null,'',location.pathname+location.search)}
function minimize(id){const w=openWins[id];if(!w||w.min)return;w.el.classList.add('minimizing');w.min=true;setTimeout(()=>{if(w.min)w.el.style.display='none'},S.anim?350:0);setActive(null)}
function restore(id){const w=openWins[id];w.min=false;w.el.style.display='';void w.el.offsetWidth;w.el.classList.remove('minimizing')}
function place(el,r){el.classList.add('anim');Object.assign(el.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});setTimeout(()=>el.classList.remove('anim'),240)}
const fullRect=()=>({x:6,y:6,w:innerWidth-12,h:deskH()-12-(S.dock?64:0)});
function zoom(id){const w=openWins[id];if(!w)return;const el=w.el;if(w.prev){place(el,w.prev);w.prev=null}else{w.prev={x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight};place(el,fullRect())}}
function tile(){const ids=Object.keys(openWins).filter(k=>!openWins[k].min).slice(-2);if(ids.length<2)return;const f=fullRect(),hw=(f.w-6)/2;place(openWins[ids[0]].el,{x:f.x,y:f.y,w:hw,h:f.h});place(openWins[ids[1]].el,{x:f.x+hw+6,y:f.y,w:hw,h:f.h})}
function cascade(){Object.keys(openWins).forEach((id,i)=>{const w=openWins[id];if(w.min)restore(id);w.el.style.zIndex=++z;place(w.el,{x:140+i*32,y:20+i*30,w:w.el.offsetWidth,h:w.el.offsetHeight})})}
function snapRect(cx,cy){const f=fullRect();if(cy<6)return f;if(cx<8)return{...f,w:f.w/2-3};if(cx>innerWidth-8)return{...f,x:f.x+f.w/2+3,w:f.w/2-3};return null}
function wireWin(id,el){
  el.addEventListener('pointerdown',()=>{if(activeId!==id)focusWin(id)});
  el.querySelector('.close').onclick=e=>{e.stopPropagation();closeWin(id)};
  el.querySelector('.min').onclick=e=>{e.stopPropagation();minimize(id)};
  el.querySelector('.max').onclick=e=>{e.stopPropagation();zoom(id)};
  const bar=el.querySelector('.wbar'),snap=$('#snap');
  bar.addEventListener('dblclick',e=>{if(!e.target.closest('button'))zoom(id)});
  bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.button)return;e.preventDefault();const w=openWins[id];
    let sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop,target=null;bar.setPointerCapture(e.pointerId);
    const mv=ev=>{if(w.prev){const ratio=(ev.clientX-el.offsetLeft)/el.offsetWidth;el.style.width=w.prev.w+'px';el.style.height=w.prev.h+'px';ox=ev.clientX-w.prev.w*ratio;oy=ev.clientY-38-18;sx=ev.clientX;sy=ev.clientY;w.prev=null}
      el.style.left=Math.min(innerWidth-80,Math.max(-el.offsetWidth+100,ox+ev.clientX-sx))+'px';el.style.top=Math.min(deskH()-40,Math.max(0,oy+ev.clientY-sy))+'px';
      target=innerWidth>=760?snapRect(ev.clientX,ev.clientY-38):null;
      if(target){Object.assign(snap.style,{left:target.x+'px',top:target.y+'px',width:target.w+'px',height:target.h+'px'});snap.classList.add('on')}else snap.classList.remove('on')};
    const up=()=>{bar.removeEventListener('pointermove',mv);bar.removeEventListener('pointerup',up);snap.classList.remove('on');
      if(target){w.prev={x:ox,y:oy,w:el.offsetWidth,h:el.offsetHeight};place(el,target)}};
    bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',up)});
  const g=el.querySelector('.grip');
  g.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const sx=e.clientX,sy=e.clientY,ow=el.offsetWidth,oh=el.offsetHeight;g.setPointerCapture(e.pointerId);
    const mv=ev=>{el.style.width=Math.max(320,ow+ev.clientX-sx)+'px';el.style.height=Math.max(200,oh+ev.clientY-sy)+'px'};
    const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up)};g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up)});
}

  if(id==='activities'){const wire=()=>el.querySelectorAll('[data-acti]').forEach(c=>c.onclick=()=>actDetail(+c.dataset.acti));wire();
    el.querySelectorAll('[data-actf]').forEach(b=>b.onclick=()=>{el.querySelectorAll('[data-actf]').forEach(x=>x.classList.toggle('on',x===b));el.querySelector('#act-list').innerHTML=actListHTML(b.dataset.actf);wire()})}

}
function waURL(f){const v=n=>f.querySelector(`[name="${n}"]`).value.trim();const name=v('name'),co=v('co'),msg=v('msg');
  const text=`Hi Christian, I'm ${name||'…'}${co?` from ${co}`:''}.\nTopic: ${v('topic')}\n\n${msg}`;return{ok:!!(name&&msg),url:`https://wa.me/${P.wa}?text=${encodeURIComponent(text)}`}}
function wireContact(root){const f=root.querySelector('form'),send=root.querySelector('.cf-send');const upd=()=>send.href=waURL(f).url;
  f.addEventListener('input',upd);f.addEventListener('change',upd);upd();f.addEventListener('submit',e=>e.preventDefault());
  send.addEventListener('click',e=>{const r=waURL(f);if(!r.ok){e.preventDefault();f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
    const n=f.querySelector('[name="name"]');(n.value.trim()?f.querySelector('[name="msg"]'):n).focus();toast('Almost there','Add your name and a message first.','contact');return}
    send.href=r.url;confetti(e.clientX,e.clientY);toast('Opening WhatsApp','Your message is ready — just press send there.','contact')})}
function wirePrefs(el){
  el.querySelectorAll('[data-wall]').forEach(t=>t.onclick=()=>{if(t.dataset.wall==='custom'&&!customWall){el.querySelector('#wfile').click();return}setWall(t.dataset.wall)});
  const fi=el.querySelector('#wfile');fi.onchange=()=>{const f=fi.files[0];if(!f)return;customWall=URL.createObjectURL(f);setWall('custom');refreshApp('prefs')};
  el.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));
  el.querySelector('#p-anim').onchange=e=>{S.anim=e.target.checked;store.set('anim',S.anim);applyAnim()};
  el.querySelector('#p-dock').onchange=e=>{S.dock=e.target.checked;store.set('dock',S.dock);applyDock()};
}
function projSheet(i){const p=P.projects[i];sheet(`<div class="pcard" style="border:0;cursor:default;transform:none;box-shadow:none"><div class="ph" style="background:${p.color}22;height:110px">${ICONS.projects}</div><div class="pb" style="padding:20px 24px"><h2 style="margin:0 0 4px">${esc(p.name)}${p.award?`<span class="award">🏆 ${p.award}</span>`:''}</h2><div class="meta">${esc(p.role)} · ${p.dates}</div><p style="font-size:15px;color:var(--text);line-height:1.6">${esc(p.desc)}</p>${p.stack.map(s=>`<span class="tag b">${esc(s)}</span>`).join('')}</div></div>`)}
function postSheet(i){sheet(postHTML(i))}
function sheet(html){const b=document.createElement('div');b.className='sheet-back';b.innerHTML=`<div class="sheet">${html}<div style="text-align:right;padding:0 20px 18px"><button class="cbtn"><span>Done</span></button></div></div>`;
  b.onclick=e=>{if(e.target===b||e.target.closest('.cbtn'))b.remove()};document.body.appendChild(b)}

/* ================= TERMINAL ================= */
function initTerm(el){
  const t=el.querySelector('#term');const out=h=>{const d=document.createElement('div');d.innerHTML=h;t.insertBefore(d,t.lastChild)};
  t.innerHTML=`<div><span class="o">Christian.OS</span> — type <span class="y">help</span> to see what I can do.\n</div><div class="line"><span class="g">christian@cn</span>:~$ <input autocomplete="off" spellcheck="false" aria-label="terminal input"></div>`;
  const inp=t.querySelector('input');el.querySelector('.wbody').addEventListener('click',()=>inp.focus());setTimeout(()=>inp.focus(),100);
  const cmds={help:()=>`<span class="y">whoami  about  experience  projects  skills  education\nresume  journal  contact  wallpaper  theme [light|dark]\nwebsite  date  clear  sudo hire christian</span>`,
    whoami:()=>`${P.name}\n${P.title} — ${P.location}`,ls:()=>'Résumé.pdf  Projects/  Journal/  Contact.app  Skills.app',date:()=>new Date().toString(),
    wallpaper:()=>{const k=Object.keys(WALLS);setWall(k[(k.indexOf(S.wall)+1)%k.length]);return 'Wallpaper → '+WALLS[S.wall].name},
    website:()=>{setTimeout(toggleMode,400);return 'Switching to website mode…'},
    'sudo hire christian':()=>{setTimeout(()=>openApp('contact'),500);return '<span class="g">Permission granted.</span> Opening Contact…'},
    clear:()=>{t.querySelectorAll('div:not(.line)').forEach(d=>d.remove());return null}};
  ['about','experience','projects','skills','education','resume','journal','contact'].forEach(k=>cmds[k]=()=>{setTimeout(()=>openApp(k),250);return 'Opening '+APPS[k].title+'…'});
  inp.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=inp.value.trim();inp.value='';out(`<span class="g">christian@cn</span>:~$ ${esc(v)}`);if(!v)return;
    let r;if(/^theme (light|dark|auto)$/.test(v)){setTheme(v.split(' ')[1]);r='Theme set.'}else if(/^echo /.test(v))r=esc(v.slice(5));else if(cmds[v])r=cmds[v]();else r=`command not found: ${esc(v)} — try <span class="y">help</span>`;
    if(r)out(r);t.scrollTop=t.scrollHeight});
}

/* ================= SEARCH PALETTE ================= */
let palItems=[],palSel=0;
function palIndex(){const L=[];Object.keys(APPS).forEach(id=>L.push({t:APPS[id].title,k:'App',ic:APPS[id].icon,go:()=>openApp(id)}));
  P.projects.forEach((p,i)=>L.push({t:p.name,k:'Project',ic:'projects',s:p.stack.join(' ')+' '+p.desc,go:()=>{S.mode==='desktop'&&openApp('projects');setTimeout(()=>projSheet(i),120)}}));
  P.jobs.forEach(j=>L.push({t:j.role,k:j.co,ic:'experience',s:j.points.join(' '),go:()=>openApp('experience')}));
  P.skills.forEach(g=>g.items.forEach(x=>L.push({t:x,k:'Skill',ic:'skills',go:()=>openApp('skills')})));
  actsSorted().forEach((a,i)=>L.push({t:a.title,k:a.type||'Activity',ic:'activities',s:[a.role,a.location,a.organizer,a.excerpt].join(' '),go:()=>{S.mode==='desktop'&&openApp('activities');setTimeout(()=>actDetail(i),120)}}));
  POSTS.forEach((p,i)=>L.push({t:p.title,k:'Post',ic:'journal',s:p.body,go:()=>openPost(i)}));
  P.certs.forEach(c=>L.push({t:c[0],k:'Certification',ic:'education',go:()=>openApp('education')}));
  L.push({t:'Message me on WhatsApp',k:'Action',ic:'contact',go:()=>openApp('contact')},{t:'Toggle dark mode',k:'Action',ic:'prefs',go:()=>setTheme(isDark()?'light':'dark')},{t:'Switch website / desktop mode',k:'Action',ic:'prefs',go:toggleMode});return L}
function palRender(){const q=$('#pal-in').value.toLowerCase().trim();const all=palIndex();
  palItems=(q?all.filter(x=>(x.t+' '+x.k+' '+(x.s||'')).toLowerCase().includes(q)):all.slice(0,10)).slice(0,12);palSel=Math.min(palSel,Math.max(0,palItems.length-1));
  $('#pal-res').innerHTML=palItems.length?palItems.map((x,i)=>`<div class="r ${i===palSel?'on':''}" data-i="${i}">${ICONS[x.ic]}<span>${esc(x.t)}</span><small>${esc(x.k)}</small></div>`).join(''):'<div class="hint" style="padding:14px">Nothing found — try “AI”, “Kafka” or “Autodesk”.</div>'}
function openPalette(){$('#palette').hidden=false;$('#pal-in').value='';palSel=0;palRender();setTimeout(()=>$('#pal-in').focus(),10)}
const closePalette=()=>$('#palette').hidden=true;
$('#pal-in').addEventListener('input',()=>{palSel=0;palRender()});
$('#pal-in').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){palSel=Math.min(palItems.length-1,palSel+1);palRender();e.preventDefault()}else if(e.key==='ArrowUp'){palSel=Math.max(0,palSel-1);palRender();e.preventDefault()}else if(e.key==='Enter'&&palItems[palSel]){closePalette();palItems[palSel].go()}});
$('#pal-res').addEventListener('click',e=>{const r=e.target.closest('[data-i]');if(r){closePalette();palItems[+r.dataset.i].go()}});
$('#palette').addEventListener('click',e=>{if(e.target.id==='palette')closePalette()});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#palette').hidden?openPalette():closePalette()}
  if(e.key==='Escape'){closePalette();if(openMenu>=0){openMenu=-1;renderMenus()}document.querySelector('.sheet-back')?.remove()}});

/* ================= TOASTS / CONFETTI ================= */
function toast(title,msg,icon){const g=document.createElement('div');g.className='toast';g.innerHTML=`${ICONS[icon]||ICONS.logo}<div><b>${title}</b><p>${msg}</p></div>`;
  $('#toasts').appendChild(g);g.onclick=()=>g.remove();setTimeout(()=>{g.classList.add('out');setTimeout(()=>g.remove(),400)},4200)}
function confetti(x,y){if(!S.anim)return;const C=['#f54e00','#f7a501','#1d4aff','#7bc35a','#b62ad9','#29dbbb'];for(let i=0;i<36;i++){const c=document.createElement('div');c.className='confetti';
  const a=Math.random()*Math.PI*2,d=80+Math.random()*160;Object.assign(c.style,{left:x+'px',top:y+'px',background:C[i%C.length]});c.style.setProperty('--dx',Math.cos(a)*d+'px');c.style.setProperty('--dy',(Math.sin(a)*d+120)+'px');c.style.setProperty('--r',(Math.random()*720-360)+'deg');
  document.body.appendChild(c);setTimeout(()=>c.remove(),1300)}}
function aboutSite(){toast('About this site',`A little desktop OS in your browser for ${P.first}'s portfolio. Drag windows to screen edges to snap them; press Ctrl/⌘ K to search.`,'logo')}

/* ================= WEBSITE MODE ================= */
function sec(id,title,icon,body){return `<section class="sec" id="${id}"><div class="sh">${ICONS[icon]}${title}</div><div class="sb">${body}</div></section>`}
function renderSite(){
  $('#site').innerHTML=`<header class="shead"><a class="brand" href="#about">${ICONS.logo}<span>${P.name}</span></a>
    <nav class="snav"><a href="#experience">Experience</a><a href="#projects">Projects</a><a href="#activities">Activities</a><a href="#skills">Skills</a><a href="#education">Education</a><a href="#journal">Journal</a><a href="#contact">Contact</a></nav>
    <div style="display:flex;gap:6px;align-items:center"><button class="tb-btn" id="s-theme" title="Toggle light/dark">${isDark()?ICONS.moon:ICONS.sun}</button><button class="cbtn white sm" id="s-mode"><span>${ICONS.desk} Desktop mode</span></button></div></header>
  <div class="sbody"><div class="wrap">
    <section class="shero" id="about"><div>
      <h1>Hi, I'm ${P.first}. I connect <em>industrial sites</em> — and build AI on the side.</h1>
      <p>${P.title} with roots in architecture. Experienced across networking, data centers and AEC, from channel partners to $200K in closed deals, plus hackathon projects in computer vision, LLMs and real-time data.</p>
      <div class="row-btns"><a class="cbtn orange lg" href="#contact"><span>${ICONS.wa} Let's talk</span></a><a class="cbtn white lg" href="${P.linkedin}" target="_blank" rel="noopener"><span>LinkedIn</span></a></div></div>
      <div class="hero-art" style="background:${wallBG()}"><img class="me" src="img/me-cutout.webp" alt="Christian Nathanael Santoso">
        <div class="minwin" style="left:3%;top:46%;width:44%;z-index:1"><div class="t">About me</div><div class="c"><div class="avatar" style="width:44px;height:44px;font-size:17px;border-radius:10px;box-shadow:2px 2px 0 #151515;float:left;margin-right:10px"><img src="img/me-face.jpg" alt="Christian Nathanael Santoso"></div><b style="color:var(--text)">${P.name}</b><br>${P.location}</div></div>
        <div class="minwin" style="right:3%;top:30%;width:38%;animation-delay:-2s;z-index:1"><div class="t">Projects</div><div class="c">🏆 Confluent AI Hackathon<br>Harvard HSIL · SEA-Lion</div></div>
        <div class="minwin" style="right:3%;bottom:6%;width:40%;animation-delay:-4s;z-index:1"><div class="t">Contact me</div><div class="c" style="display:flex;gap:6px;align-items:center">${ICONS.wa.replace('<svg','<svg width="16" height="16"')} ${P.phone}</div></div>
      </div></section>
    ${sec('experience','Experience','experience',P.jobs.map(j=>`<div class="job"><h3>${j.role}</h3><div class="meta"><b>${j.co}</b> · ${j.place} · ${j.dates}</div><ul>${j.points.map(p=>`<li>${p}</li>`).join('')}</ul></div>`).join(''))}
    ${sec('projects','Projects','projects',`<div class="cols">${P.projects.map(projCard).join('')}</div>`)}
    ${sec('activities','Activities','activities',`<div class="timeline" style="padding:0">${actListHTML('All')}</div>`)}
    ${sec('skills','Skills','skills',`<div class="cols">${P.skills.map(g=>`<div><h3 style="margin:0 0 8px;font-size:15px">${g.group}</h3>${g.items.map(x=>`<span class="tag ${g.c}">${x}</span>`).join('')}</div>`).join('')}</div>`)}
    ${sec('education','Education & certifications','education',eduHTML())}
    ${sec('journal','Journal','journal',`<div class="cols">${POSTS.map((p,i)=>`<div class="pcard" data-spost="${i}"><div class="pb"><div class="meta" style="margin:0 0 4px;font-size:12px">${fmtDate(p.date)}${p.sample?'<span class="sample">sample</span>':''}</div><h3>${esc(p.title)}</h3><p>${esc(p.excerpt||'')}</p><span class="cbtn white sm"><span>Read →</span></span></div></div>`).join('')}</div>`)}
    ${sec('contact','Contact me','contact',`<div class="cf-site" style="max-width:640px">${contactHTML()}</div>`)}
  </div><div class="sfoot">© ${new Date().getFullYear()} ${P.name} · ${P.location}</div></div>`;
  $('#s-theme').onclick=()=>setTheme(isDark()?'light':'dark');$('#s-mode').onclick=toggleMode;
  wireContact($('#site .cf-site'));
  $('#site').querySelectorAll('[data-spost]').forEach(c=>c.onclick=()=>postSheet(+c.dataset.spost));
  $('#site').querySelectorAll('#activities [data-acti]').forEach(c=>c.onclick=()=>actDetail(+c.dataset.acti));
  $('#site').querySelectorAll('#projects [data-proj]').forEach(c=>c.onclick=()=>projSheet(+c.dataset.proj));
}
function toggleMode(){S.mode=S.mode==='desktop'?'website':'desktop';store.set('mode',S.mode);applyMode()}
function applyMode(){const web=S.mode==='website';document.body.classList.toggle('website',web);
  if(web){Object.keys(openWins).forEach(closeWin);renderSite();scrollTo(0,0)}else{$('#site').innerHTML='';renderIcons();renderDock();renderMenus();if(!Object.keys(openWins).length)setTimeout(()=>openApp('about'),200)}}

/* ================= ROUTING / INIT ================= */
function route(){const h=location.hash.slice(1);if(!h||!APPS[h])return;if(S.mode==='desktop')openApp(h);else document.getElementById(h)?.scrollIntoView()}
addEventListener('hashchange',route);
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(S.mode==='desktop')renderIcons()},150)});
applyTheme();applyAnim();applyDock();renderMenus();renderDock();
document.body.classList.toggle('website',S.mode==='website');
if(S.mode==='website'){renderSite();route()}
else{renderIcons();if(location.hash&&APPS[location.hash.slice(1)])route();else setTimeout(()=>openApp('about'),250);
  setTimeout(()=>toast(`Welcome to ${P.first}'s desktop`,'Click any icon to open it. Drag windows to an edge to snap. Press Ctrl/⌘ K to search.','me'),700)}
loadPosts();
})();
</script>
</body>
</html>
